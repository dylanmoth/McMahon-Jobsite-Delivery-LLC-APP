name: Windows Release Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check src tests migrations
      - run: python -m black --check src tests migrations
      - run: python -m PyInstaller --noconfirm --clean --workpath build\pyinstaller build\McMahonDispatch.spec
